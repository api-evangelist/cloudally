components:
  schemas:
    AccessibleAccountsDTO:
      type: object
      description: Defines the set of accounts the user is allowed to access
      properties:
        accessType:
          type: string
          description: Access type. Use 'custom' to restrict access to the listed accountIds, or 'all' to grant access to all accounts
          example: custom
          minLength: 1
          pattern: (?i)all|custom
        accountIds:
          type: array
          description: List of account UUIDs the user can access (relevant when accessType is 'custom')
          example:
          - 123d1dcf-e845-4756-9654-adbe014d1aaa
          items:
            type: string
      required:
      - accessType
    CreateCustomRoleUserDTO:
      type: object
      description: Request body for creating a partner user with a custom role
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
          minLength: 1
        password:
          type: string
          description: User password
          example: P@ssw0rd!
          minLength: 1
        role:
          type: string
          description: User role. Use 'custom' to apply the fine-grained permissions block. Use role='administrator' for full permissions or role='custom' with a permissions block
          example: custom
          minLength: 1
          pattern: (?i)administrator|custom
        permissions:
          $ref: '#/components/schemas/PermissionsDTO'
          description: Fine-grained permission settings for the user
        accessibleAccounts:
          $ref: '#/components/schemas/AccessibleAccountsDTO'
          description: Defines which accounts the user can access
      required:
      - accessibleAccounts
      - email
      - password
      - role
    V2BillingDetailsView:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        discount:
          type: number
          format: double
        currency:
          type: string
          enum:
          - USD
          - EUR
          - AUD
          - GBP
          - ILS
          - CAD
          - JPY
        paymentType:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        nextPaymentDate:
          type: string
          format: date-time
        subscribed:
          type: boolean
        total:
          type: number
          format: double
        trialDaysLeft:
          type: integer
          format: int32
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillingLinesView'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        partnerId:
          type: string
    PartnerView:
      type: object
      properties:
        partnerId:
          type: string
          description: Partner ID
        email:
          type: string
          description: Partner account email
        contactName:
          type: string
          description: Contact person name
        discount:
          type: integer
          format: int32
          description: Discount for the partner
        phone:
          type: string
          description: Contact person phone
        currency:
          type: string
          description: Currency used for billing
          enum:
          - USD
          - EUR
          - AUD
          - GBP
          - ILS
          - CAD
          - JPY
        address:
          type: string
          description: Partner address
        region:
          type: string
          description: Datacenter region
          enum:
          - US_EST
