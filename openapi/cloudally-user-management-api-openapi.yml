openapi: 3.2.0
info:
  title: Cloudally REST User management API
  description: Cloudally integration API for your platform.
  termsOfService: https://cybersecurity.opentext.com/legal/agreements-for-cybersecurity-data-security-and-data-protection-solutions/
  contact:
    name: Cloudally Support
    url: https://www.cloudally.com/contactus/
    email: support@cloudally.com
servers:
- url: https://api.cloudally.com
  description: Generated server url
tags:
- name: User Management
  description: Endpoint for Cloudally user management.
paths:
  /v2/user/{id}/permissions:
    put:
      tags:
      - User Management
      summary: updatePermissionsUser
      description: Update permission setting of a Cloudally account user.
      operationId: updatePermissionsUser
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPermissionsDTO'
        required: true
      responses:
        '200':
          description: Successful retrieval of the information.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JsonResponseDTO'
        '401':
          description: The user is not logged in.
        '403':
          description: The user does not have an access to view the account activity.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
  /v1/user/{id}/permissions:
