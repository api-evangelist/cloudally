components:
  schemas:
    EntityStatusPageView:
      type: object
      description: Pageable response containing a list of EntityStatusView
      properties:
        page:
          type: integer
          format: int32
          description: Page number
        totalPages:
          type: integer
          format: int32
          description: Total pages
        total:
          type: integer
          format: int32
          description: Number of items per page
        nextPageToken:
          type: string
          description: Next page token
        data:
          type: array
          description: Response items
          items:
            $ref: '#/components/schemas/EntityStatusView'
    BackupStatusView:
      type: object
      properties:
        subSource:
          type: string
          description: Service sub-type (mail, tasks, calendar, etc.)
        status:
          type: string
          description: Task status
        error:
          type: string
          description: Short meaningful error
        errFAQLink:
          type: string
          description: Link of error to FAQ page
    UserPasswordDTO:
      type: object
      properties:
        newPassword:
          type: string
          description: New password
          minLength: 1
        password:
          type: string
          description: Old password
      required:
      - newPassword
    CreateSecondaryUserDTO:
      type: object
      description: User credentials
      properties:
        accessLevel:
          type: string
          description: Account access level
          enum:
          - NONE
          - CUSTOM
          - FULL
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PermissionsView'
          description: Account permissions table
        email:
          type: string
          description: Additional account email
        password:
          type: string
          description: Additional account password
          minLength: 1
      required:
      - password
    CustomStorage:
      type: object
      properties:
        type:
          type: string
          description: Cloud storage type
          enum:
          - S3
          - S3_COMPATIBLE
          - GCP
          - AZURE
          - DISTRIBUTOR_CLOUD
        s3Key:
          type: string
          description: Amazon S3 account key
        s3Secret:
          type: string
          description: Amazon S3 account secret
        s3Region:
          type: string
          description: Amazon S3 region
          enum:
          - US_EST
          - EU
          - EU_FRANKFURT
          - CANADA
          - ASIA_SIDNEY
          - ASIA_TOKYO
          - LONDON
          - EU_PARIS
          - AFRICA_CAPE_TOWN
          - ASIA_MUMBAI
          - EU_ZURICH
        s3Bucket:
          type: string
          description: Amazon S3 bucket name
        endPoint:
          type: string
          description: Amazon S3 compatible endpoint
    UserView:
      type: object
      properties:
        id:
          type: string
          description: Account access level
        name:
          type: string
          description: Account friendly name
        email:
          type: string
          description: Account email
        status:
          type: string
          description: Account status
          enum:
          - ACTIVE
          - NOTACTIVE
          - BLOCKED
          - DELETED
          - TRIAL
          - UNSUBSCRIBED
        date:
          type: integer
          format: int32
          description: Subscription date
        dailyReport:
          type: boolean
          description: Toggle send daily report
        region:
          type: string
          description: Account data center
          enum:
          - US_EST
          - US_EST_OHIO
          - US_WEST_OREGON
          - US_WEST_CAL
          - EU
          - EU_FRANKFURT
          - ASIA_HONG_KONG
          - ASIA_MUMBAI
          - ASIA_SEOUL
          - ASIA_SINGAPORE
          - ASIA_SIDNEY
          - ASIA_TOKYO
          - SOUTH_AMERICA
          - AFRICA_CAPE_TOWN
          - ASIA_CHINA
          - CANADA
          - LONDON
          - EU_PARIS
          - EU_STOCKHOLM
          - EU_ZURICH
        discount:
          type: integer
          format: int32
          description: Account discount
        reportEmails:
          type: array
          description: Email list to send reports to
          items:
            type: string
        partnerID:
          type: string
          description: Account partner ID
        currency:
          type: string
          description: Account billing currency
          enum:
          - USD
          - EUR
          - AUD
          - GBP
          - ILS
          - CAD
          - JPY
        customStorage:
          $ref: '#/components/schemas/CustomStorageView'
          description: Custom cloud storage
        ms365EnterprisePlan:
          type: boolean
          description: MS 365 Bundle plan
        gsuiteEnterprisePlan:
          type: boolean
          description: Google Workspace Bundle plan
        externalId:
          type: string
          description: External ID of the user
    CustomStorageView:
      type: object
      properties:
        type:
          type: string
          enum:
          - S3
          - S3_COMPATIBLE
          - GCP
          - AZURE
          - DISTRIBUTOR_CLOUD
    PermissionsView:
      type: object
      properties:
        service:
          type: string
          description: Service type
          enum:
          - ACCOUNT
          - USERS
          - SUPPORT
          - PAYMENTS
          - BILLING_STATE
          - ACCOUNT_ACTIVITY
          - BACKUPS
          - RESTORE_AND_DOWNLOAD
          - PREVIEW
          - DASHBOARD
          - DASHBOARD_ACCOUNT
          - DASHBOARD_SUBSCRIBE
          - PP_ACCOUNT
          - PP_SECURITY_AUDIT
          - PP_PAYMENTS
          - PP_BILLING_STATE
          - MANAGE_NOTIFICATIONS
          - EXPORT_USAGE_REPORT
          - PP_MANAGE_NOTIFICATIONS
          - ACCOUNT_SECURITY_AUDIT
          - MS365
          - MS365GROUPS
          - SHAREPOINT_MULTI
          - SHAREPOINT
          - ONEDRIVE
          - GOOGLEAPPS
          - GDRIVETEAM
          - SFC
          - BOX
          - GACCOUNTS
          - IMAP
          - YMAIL
          - DDB
          - SDB
