openapi: 3.2.0
info:
  title: Cloudally REST Restore & Download API
  description: Cloudally integration API for your platform.
  termsOfService: https://cybersecurity.opentext.com/legal/agreements-for-cybersecurity-data-security-and-data-protection-solutions/
  contact:
    name: Cloudally Support
    url: https://www.cloudally.com/contactus/
    email: support@cloudally.com
servers:
- url: https://api.cloudally.com
  description: Generated server url
tags:
- name: Restore & Download
  description: Endpoint for Cloudally account activity.
paths:
  /v2/resellers/accounts/{accountId}/recovery/restore:
    post:
      tags:
      - Restore & Download
      summary: createRestore
      description: Restore from a backup.
      operationId: createRestore
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDTO'
        required: true
      responses:
        '200':
          description: Successful retrieval of the information.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestoreOrDownloadResultDTO'
        '401':
          description: The user is not logged in.
        '403':
          description: The user does not have an access to view the account activity.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
  /v2/resellers/accounts/{accountId}/recovery/export:
    post:
      tags:
      - Restore & Download
      summary: createExport
      description: Download a backup.
      operationId: createExport
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDTO'
        required: true
      responses:
        '200':
          description: Successful retrieval of the information.
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: The user is not logged in.
        '403':
          description: The user does not have an access to view the account activity.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
