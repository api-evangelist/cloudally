components:
  schemas:
    RefreshTokenView:
      type: object
      properties:
        refreshToken:
          type: string
    TokenView:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token to retrieve data
        tokenType:
          type: string
          description: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Expiration date for the access token
        refreshToken:
          type: string
          description: Refresh token used to update access token
    UnauthorizedError:
      type: object
      properties:
        errorMessage:
          type: string
          example: Invalid client credentials
    TokenViewV2:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token to retrieve data
        tokenType:
          type: string
          description: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Expiration date for the access token
        refreshToken:
          type: string
          description: Refresh token used to update access token
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Expiration date for the access token
    SignView:
      type: object
      description: Authorization credentials
      properties:
        email:
          type: string
          description: Account email
        password:
          type: string
          description: Account password
